name: claude-terminal
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
targets:
  claude-terminal:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Hook
      - Resources/Assets.xcassets
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/markdown-viewer
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: claude-terminal-Bridging-Header.h
        OTHER_LDFLAGS:
          - "-lc++"
        CODE_SIGN_ENTITLEMENTS: claude-terminal.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.claire.claude-terminal
        PRODUCT_NAME: claude-terminal
        MARKETING_VERSION: "0.41.3"
        CURRENT_PROJECT_VERSION: "60"
        INFOPLIST_FILE: Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - framework: GhosttyKit.xcframework
        embed: false
      - package: Sparkle
      - target: claude-terminal-hook
        embed: true
        codeSign: true
        copyPhase:
          destination: executables
    preBuildScripts:
      - script: '"${PROJECT_DIR}/scripts/ensure-ghosttykit.sh"'
        name: Build GhosttyKit

  claude-terminal-hook:
    type: tool
    platform: macOS
    sources:
      - Sources/Hook
    settings:
      base:
        PRODUCT_NAME: claude-terminal-hook
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # Prevent xcodebuild archive from treating this as a standalone
        # distributable; it's only embedded inside the main app.
        SKIP_INSTALL: YES
        INSTALL_PATH: ""
