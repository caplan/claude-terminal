<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="github-markdown.css">
  <link rel="stylesheet" href="highlight.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="highlight-dark.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="viewer.css">
  <script src="marked.min.js"></script>
  <script src="purify.min.js"></script>
  <script src="highlight.min.js"></script>
  <script src="mermaid.min.js"></script>
</head>
<body>
  <article class="markdown-body" id="content"
           data-color-mode="auto"
           data-light-theme="light"
           data-dark-theme="dark"></article>
  <script>
    (function () {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: isDark ? 'dark' : 'default'
      });

      const renderer = new marked.Renderer();
      const defaultCode = renderer.code.bind(renderer);
      renderer.code = function (code, lang, escaped) {
        if ((lang || '').trim().toLowerCase() === 'mermaid') {
          const esc = String(code)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          return '<pre class="mermaid">' + esc + '</pre>';
        }
        return defaultCode(code, lang, escaped);
      };

      // GitHub-style heading slugger used in a post-render DOM pass. This is
      // more robust than overriding marked's renderer — it survives DOMPurify
      // and any future change to the Renderer API.
      function slugify(text, counts) {
        let slug = String(text || '').toLowerCase()
          .trim()
          .replace(/[^\p{L}\p{N} \-_]/gu, '')
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-+|-+$/g, '');
        if (!slug) slug = 'section';
        const count = counts[slug] || 0;
        counts[slug] = count + 1;
        return count === 0 ? slug : slug + '-' + count;
      }

      marked.setOptions({ gfm: true, breaks: false, renderer: renderer });

      // DOMPurify config permissive enough to allow mermaid's SVG output
      // after render. We sanitize the initial marked HTML (before mermaid
      // runs) to strip any script/iframe/etc. from user markdown; the
      // SVG that mermaid injects after is trusted.
      const purifyConfig = {
        USE_PROFILES: { html: true }
      };

      let ready = false;
      let pending = null;
      const el = document.getElementById('content');

      window.render = async function (src) {
        if (!ready) { pending = src; return; }
        const prevScroll = window.scrollY;
        const html = marked.parse(src || '');
        const safe = DOMPurify.sanitize(html, purifyConfig);
        el.innerHTML = safe;

        // Assign slugged ids to headings after sanitization so in-document
        // anchor links work. Use a fresh counter each render so ids stay
        // stable across hot reloads.
        const counts = {};
        el.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (h) {
          h.id = slugify(h.textContent, counts);
        });

        // Explicit click handler on #-anchors. WKWebView's default fragment
        // navigation is unreliable when innerHTML is replaced by a hot
        // reload, so scroll manually and defeat same-hash no-op.
        el.querySelectorAll('a[href^="#"]').forEach(function (a) {
          a.addEventListener('click', function (ev) {
            const href = a.getAttribute('href') || '';
            if (href.length <= 1) return;
            const target = document.getElementById(href.slice(1));
            if (!target) return;
            ev.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', href);
          });
        });

        try {
          await mermaid.run({ querySelector: '.mermaid' });
        } catch (e) {
          console.warn('mermaid render error', e);
        }

        // Enable pan/zoom on each rendered mermaid SVG independently of the
        // page zoom. Plain wheel/trackpad scroll passes through to the page;
        // Cmd/Ctrl + wheel zooms the diagram around the cursor. Click-drag
        // pans. Double-click resets.
        el.querySelectorAll('pre.mermaid svg').forEach(enableMermaidPanZoom);
        el.querySelectorAll('pre code').forEach(function (block) {
          if (!block.classList.contains('hljs')) {
            try { hljs.highlightElement(block); } catch (_) {}
          }
        });
        window.scrollTo(0, prevScroll);
      };

      // Scroll reporting → Swift (throttled). Used to persist scroll
      // position so it can be restored across quit/restart.
      let __scrollThrottle = null;
      let __lastSentScroll = -1;
      window.addEventListener('scroll', function () {
        if (__scrollThrottle) return;
        __scrollThrottle = setTimeout(function () {
          __scrollThrottle = null;
          const y = Math.round(window.scrollY);
          if (y === __lastSentScroll) return;
          __lastSentScroll = y;
          try {
            window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers.scroll &&
              window.webkit.messageHandlers.scroll.postMessage(y);
          } catch (_) {}
        }, 150);
      });

      // Called by Swift after restoring a session to put the scroll
      // position back where it was before the app quit.
      window.setScroll = function (y) {
        window.scrollTo(0, y || 0);
      };

      function enableMermaidPanZoom(svg) {
        if (svg.__panZoomInitialized) return;
        svg.__panZoomInitialized = true;

        const pre = svg.closest('pre.mermaid');
        if (pre && !pre.querySelector('.mermaid-hint')) {
          const hint = document.createElement('div');
          hint.className = 'mermaid-hint';
          hint.textContent = '⌘ + scroll: zoom  ·  drag: pan  ·  dbl-click: reset';
          pre.appendChild(hint);
        }

        let scale = 1, tx = 0, ty = 0;
        let dragging = false, startX = 0, startY = 0;

        svg.style.cursor = 'grab';
        svg.style.transformOrigin = '0 0';
        svg.style.userSelect = 'none';

        function apply() {
          svg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
        }

        svg.addEventListener('wheel', function (e) {
          if (!e.ctrlKey && !e.metaKey) return; // let page scroll
          e.preventDefault();
          const rect = svg.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;
          const factor = e.deltaY < 0 ? 1.1 : (1 / 1.1);
          const next = Math.max(0.2, Math.min(10, scale * factor));
          const k = next / scale;
          tx = mx - (mx - tx) * k;
          ty = my - (my - ty) * k;
          scale = next;
          apply();
        }, { passive: false });

        svg.addEventListener('mousedown', function (e) {
          if (e.button !== 0) return;
          dragging = true;
          startX = e.clientX - tx;
          startY = e.clientY - ty;
          svg.style.cursor = 'grabbing';
          e.preventDefault();
        });

        window.addEventListener('mousemove', function (e) {
          if (!dragging) return;
          tx = e.clientX - startX;
          ty = e.clientY - startY;
          apply();
        });

        window.addEventListener('mouseup', function () {
          if (!dragging) return;
          dragging = false;
          svg.style.cursor = 'grab';
        });

        svg.addEventListener('dblclick', function (e) {
          e.preventDefault();
          scale = 1; tx = 0; ty = 0;
          apply();
        });
      }

      // Signal readiness after libs are defined.
      ready = true;
      if (pending != null) {
        const src = pending; pending = null;
        window.render(src);
      }
    })();
  </script>
</body>
</html>
